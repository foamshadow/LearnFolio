version: '3'

vars:
  GOLANGCI_LINT_VERSION: v2.15.0

tasks:
  setup:
    desc: 一条命令安装 Node 依赖、git hooks 与 Go 工具
    cmds:
      - task: setup:node
      - task: setup:hooks
      - task: setup:go

  setup:node:
    desc: 安装 Node 依赖（pnpm install）
    cmds:
      - pnpm install

  setup:hooks:
    desc: 安装 lefthook git hooks（需先 setup:node），并在未设置时启用 .gitmessage 提交模板
    cmds:
      - pnpm exec lefthook install
      - |
        if ! git config --get commit.template >/dev/null; then
          git config --local commit.template .gitmessage
          echo "commit.template → .gitmessage"
        else
          echo "commit.template 已设置（$(git config --get commit.template)），未覆盖"
        fi

  setup:go:
    desc: 下载 Go 模块并安装固定版本 golangci-lint
    dir: apps/api
    cmds:
      - go mod download
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  ci:
    desc: 本地 CI 等价物
    cmds:
      - task: check:catalog
      - task: ci:web
      - task: ci:api

  ci:web:
    desc: Web 端 lint / format / typecheck / build
    cmds:
      - pnpm --filter @learnfolio/web lint
      - pnpm --filter @learnfolio/web format:check
      - pnpm --filter @learnfolio/web typecheck
      - pnpm --filter @learnfolio/web build

  ci:api:
    desc: API 端 build / test / lint / 契约检查
    dir: apps/api
    cmds:
      - go build ./...
      - go test ./...
      - golangci-lint run ./...
      - task: gen:check

  gen:
    desc: 生成 OpenAPI 契约
    dir: apps/api
    cmds:
      - go run ./cmd/api openapi --output docs/openapi.yaml

  gen:check:
    desc: 校验契约生成物无漂移
    dir: apps/api
    cmds:
      - task: gen
      - git diff --exit-code -- docs/openapi.yaml

  check:catalog:
    desc: 校验根 package.json 与 apps / packages 的直接依赖均走 catalog 或 workspace
    cmds:
      - node .github/scripts/check-catalog.mjs

  db:up:
    desc: 启动本地依赖服务（PG；前置：根 .env 存在——cp .env.example .env）
    cmds:
      - docker compose --project-directory . --env-file .env -f infra/docker-compose.yml up -d

  db:down:
    desc: 停止本地依赖服务（数据保留在命名卷；删卷用 down -v，慎用）
    cmds:
      - docker compose --project-directory . --env-file .env -f infra/docker-compose.yml down

  merge:
    desc: 合并已 PASS 的 PR（快照校验；docs squash / code --no-ff；需人类授权）
    cmds:
      - bash scripts/merge.sh {{.CLI_ARGS}}

  retract:
    desc: 撤回 dev 头部提交并恢复 PR 门禁（P2b；需人类确认）
    cmds:
      - bash scripts/retract.sh {{.CLI_ARGS}}

  test:merge:
    desc: 快照合并脚本的 fixture 自测（不触网、不合并）
    cmds:
      - bash scripts/tests/merge-snapshot-test.sh

  test:retract:
    desc: retract 提示 commit 的 fixture 自测（不触网、不动 ruleset）
    cmds:
      - bash scripts/tests/retract-hint-test.sh

  format:
    desc: 用 Prettier 格式化 Web 代码
    cmds:
      - pnpm --filter @learnfolio/web format

  dev:web:
    desc: 启动 Web 开发服务器（自动加载根 .env）
    dotenv: ['.env']
    cmds:
      - pnpm --filter @learnfolio/web dev

  dev:api:
    desc: 启动 API 开发服务器（自动加载根 .env）
    dir: apps/api
    # 任务目录是 apps/api，根 .env 相对此处是 ../../.env
    dotenv: ['../../.env']
    cmds:
      - go run ./cmd/api
