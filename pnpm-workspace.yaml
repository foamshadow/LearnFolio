# 版本单一真源：应用依赖一律写 catalog:，升级只改这里
packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  '@nuxt/eslint': 1.17.0
  eslint: 10.15.0
  nuxt: 4.6.4
  typescript: 5.9.3
  vue: 3.5.45
  vue-router: 5.5.1
  vue-tsc: 3.3.14

# engines 仅声明：本地以 .nvmrc + fnm 为准，CI 用 setup-node 的 node-version-file
